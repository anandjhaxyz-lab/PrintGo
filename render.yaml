# NOTE: This is the legacy standalone Blueprint template (printgo-backend / printgo-db / printgo-redis).
# It does NOT describe the live printgo-backend-staging or printgo-backend-production services.
# Do not sync this Blueprint into the current Render workspace until resource ownership and names are reconciled.
services:
  - type: web
    name: printgo-backend
    env: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: printgo-db
          property: connectionString
      - key: CASHFREE_APP_ID
        sync: false # Set this in Render Dashboard after deployment
      - key: CASHFREE_SECRET_KEY
        sync: false # Set this in Render Dashboard after deployment
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        generateValue: true
      - key: REDIS_HOST
        fromService:
          type: redis
          name: printgo-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: printgo-redis
          property: port

  - type: redis
    name: printgo-redis
    plan: free

databases:
  - name: printgo-db
    databaseName: printgo
    user: printgo_user
    plan: free
