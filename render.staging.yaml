# PrintGo Staging Render Blueprint
# Architecture B — Isolated Staging Environment (Zero Production Impact)

services:
  # 1. PrintGo Staging Backend Web Service
  - type: web
    name: printgo-backend-staging
    env: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: printgo-storage-staging
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.x
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: printgo-db-staging
          property: connectionString
      - key: ALLOWED_ORIGINS
        # Set to BOTH staging customer portal AND admin dashboard HTTPS origins, comma-separated with no trailing slashes
        # Example: https://<staging-customer-domain>,https://printgo-admin-staging.onrender.com
        sync: false
      - key: FRONTEND_URL
        # Set to the deployed staging customer frontend HTTPS URL (e.g. https://s3k-print-staging.vercel.app)
        sync: false
      - key: ADMIN_READ_ONLY
        value: "true"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: INVOICE_DIR
        value: /var/data/invoices
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: MACHINE_KEY
        # Dedicated staging-only machine key (NEVER reuse production Hyderabad MACHINE_KEY)
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: PUBLIC_APP_URL
        # Set to the deployed staging customer frontend HTTPS URL (e.g. https://s3k-print-staging.vercel.app)
        sync: false
      - key: CASHFREE_NOTIFY_URL
        # Set to the verified staging backend webhook URL (e.g. https://printgo-backend-staging.onrender.com/api/payments/webhook)
        sync: false
      - key: ENABLE_DEMO_PAYMENT
        value: "false"

  # 2. PrintGo Staging Admin Dashboard (Admin-Only Static Site; Customer Portal deploys on Vercel)
  - type: web
    name: printgo-admin-staging
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Set to the deployed staging backend URL (e.g. https://printgo-backend-staging.onrender.com)
        sync: false
      - key: VITE_APP_MODE
        value: admin

# Note: Redis is intentionally omitted for single-instance staging.
# Code verification (redisClient.js, queueService.js, upload.controller.js, server.js)
# confirms single-instance staging runs safely with in-memory Socket.IO and print dispatch fallback,
# saving $7.00/mo ($16.50/mo total instead of $23.50/mo). Re-add Redis when scaling multi-instance.

# Persistent PostgreSQL Database for Staging (0.1c-256mb Entry Paid Plan — Non-expiring, Isolated from printgo_db)
databases:
  - name: printgo-db-staging
    databaseName: printgo_staging
    user: printgo_staging_user
    plan: 0.1c-256mb
