<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Blue to Midnight Navy -->
    <linearGradient id="s3kBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070B19"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="s3kGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#s3kBg)"/>

  <!-- Metallic Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#s3kGold)" stroke-width="14" stroke-opacity="0.95"/>

  <!-- S3K Monogram -->
  <g filter="url(#badgeShadow)">
    <text x="256" y="295" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="210" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="url(#s3kGold)">S3K</text>
  </g>

  <!-- Gold Accent Divider -->
  <line x1="88" y1="344" x2="424" y2="344" stroke="url(#s3kGold)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- Brand Subtitle -->
  <text x="256" y="396" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="10" 
        text-anchor="middle" 
        fill="#FFFFFF">PRINT YOURSELF</text>

  <text x="256" y="432" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
        font-size="18" 
        font-weight="800" 
        letter-spacing="6" 
        text-anchor="middle" 
        fill="#F59E0B">SELF PRINTING KIOSK</text>
</svg>
